name: Build image and update manifest

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - ".github/workflows/build-and-update.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gitops-lab-web" >> $GITHUB_OUTPUT
          echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push image
        working-directory: ./app
        run: |
          docker build -t ${{ steps.meta.outputs.IMAGE }}:${{ steps.meta.outputs.TAG }} .
          docker push ${{ steps.meta.outputs.IMAGE }}:${{ steps.meta.outputs.TAG }}

      - name: Update deployment manifest
        run: |
          sed -i "s|image: .*|image: ${{ steps.meta.outputs.IMAGE }}:${{ steps.meta.outputs.TAG }}|g" k8s/deployment.yaml

      - name: Commit manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "Update image to ${{ steps.meta.outputs.TAG }}" || echo "No changes to commit"
          git push